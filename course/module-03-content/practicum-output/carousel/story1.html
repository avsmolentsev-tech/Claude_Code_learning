<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; font-family:'Inter',system-ui,sans-serif; background:#0E3B30; position:relative; overflow:hidden; }
.accent-bar { position:absolute; left:0; top:0; width:20px; height:100%; background:#10A37F; }
.wrap { padding:140px 90px; height:100%; display:flex; flex-direction:column; justify-content:center; }
.badge { display:inline-block; background:rgba(16,163,127,0.18); color:#4FD8B0; font-size:28px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; padding:14px 28px; border-radius:10px; margin-bottom:60px; width:fit-content; }
h1 { color:#fff; font-size:88px; font-weight:700; line-height:1.2; margin-bottom:50px; }
h1 span { color:#3ECFA0; }
p { color:#9FD9C9; font-size:38px; line-height:1.6; max-width:820px; }
.tap { position:absolute; bottom:110px; left:90px; right:90px; text-align:center; color:#5E9C8A; font-size:30px; }
.bar-top { position:absolute; top:60px; left:90px; right:90px; height:6px; background:rgba(255,255,255,0.2); border-radius:3px; }
.bar-fill { width:35%; height:100%; background:#fff; border-radius:3px; }
</style></head>
<body>
<div class="accent-bar"></div>
<div class="bar-top"><div class="bar-fill"></div></div>
<div class="wrap">
  <div class="badge">Наш принцип</div>
  <h1>Мы открыто<br>показываем<br><span>цены. Всегда.</span></h1>
  <p>Без «свяжитесь с менеджером».<br>Хотите узнать стоимость —<br>она уже на сайте.</p>
</div>
<div class="tap">смахните вверх, чтобы перейти на сайт ↑</div>
</body></html>
