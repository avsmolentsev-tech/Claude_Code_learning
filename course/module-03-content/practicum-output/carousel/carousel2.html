<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; background:#fff; position:relative; overflow:hidden; }
.wrap { padding:90px; height:100%; display:flex; flex-direction:column; justify-content:center; }
.num { width:100px; height:100px; border-radius:50%; background:#10A37F; color:#fff; font-size:48px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-bottom:44px; }
h1 { color:#171717; font-size:64px; font-weight:700; line-height:1.25; margin-bottom:30px; }
p { color:#6B7280; font-size:32px; line-height:1.5; max-width:820px; }
.dots { position:absolute; bottom:75px; left:90px; display:flex; gap:10px; }
.dot { width:10px; height:10px; border-radius:50%; background:#E5E7EB; }
.dot.active { background:#10A37F; }
.swipe { position:absolute; bottom:70px; right:90px; color:#9CA3AF; font-size:26px; }
</style></head>
<body>
<div class="wrap">
  <div class="num">1</div>
  <h1>Сборка — платно или входит в цену?</h1>
  <p>У нас — всегда входит. Проверьте это в прайсе перед тем, как сравнивать «одинаковые» цены у разных продавцов.</p>
</div>
<div class="dots"><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="swipe">листайте →</div>
</body></html>
