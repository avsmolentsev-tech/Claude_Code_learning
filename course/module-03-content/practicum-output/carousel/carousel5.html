<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; background:#10A37F; position:relative; overflow:hidden; }
.wrap { padding:90px; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
h1 { color:#fff; font-size:70px; font-weight:700; line-height:1.2; margin-bottom:36px; }
p { color:rgba(255,255,255,0.85); font-size:34px; line-height:1.5; margin-bottom:50px; }
.btn { background:#fff; color:#0B7A61; font-size:30px; font-weight:700; padding:22px 44px; border-radius:12px; }
.dots { position:absolute; bottom:75px; left:90px; display:flex; gap:10px; }
.dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.35); }
.dot.active { background:#fff; }
</style></head>
<body>
<div class="wrap">
  <h1>Есть ещё вопросы про мебель для офиса?</h1>
  <p>Спрашивайте в комментариях — разберём честно, без рекламных штучек.</p>
  <div class="btn">Написать нам →</div>
</div>
<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
</body></html>
