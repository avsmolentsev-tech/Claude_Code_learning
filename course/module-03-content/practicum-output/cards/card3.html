<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; background:#F9FAFB; position:relative; overflow:hidden; }
.wrap { padding:80px; height:100%; display:flex; flex-direction:column; justify-content:center; }
.eyebrow { color:#10A37F; font-size:24px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:20px; }
h1 { color:#171717; font-size:56px; font-weight:700; line-height:1.22; margin-bottom:40px; max-width:860px; }
.stats { display:flex; gap:20px; margin-top:10px; }
.stat { flex:1; background:#fff; border:1px solid #E5E7EB; border-radius:16px; padding:30px 26px; text-align:center; }
.stat .n { font-size:52px; font-weight:700; color:#10A37F; display:block; margin-bottom:10px; }
.stat .l { font-size:22px; color:#6B7280; font-weight:600; }
.foot { position:absolute; bottom:70px; left:80px; right:80px; padding-top:26px; color:#6B7280; font-size:22px; border-top:1px solid #E5E7EB; }
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">Из первых рук</div>
  <h1>Мы съездили на фабрику в 130 км от Казани</h1>
  <div class="stats">
    <div class="stat"><span class="n">130 км</span><span class="l">до производства</span></div>
    <div class="stat"><span class="n">0</span><span class="l">посредников</span></div>
    <div class="stat"><span class="n">-30%</span><span class="l">к цене на столы</span></div>
  </div>
  <div class="foot">офисная мебель · Казань</div>
</div>
</body></html>
