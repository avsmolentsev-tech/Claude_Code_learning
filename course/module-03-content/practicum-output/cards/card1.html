<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; background:#0E3B30; position:relative; overflow:hidden; }
.accent-bar { position:absolute; left:0; top:0; width:18px; height:100%; background:#10A37F; }
.wrap { padding:100px 90px; height:100%; display:flex; flex-direction:column; justify-content:center; }
.badge { display:inline-block; background:rgba(16,163,127,0.18); color:#4FD8B0; font-size:24px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; padding:10px 22px; border-radius:8px; margin-bottom:48px; width:fit-content; }
h1 { color:#fff; font-size:76px; font-weight:700; line-height:1.15; margin-bottom:40px; }
h1 span { color:#3ECFA0; }
p { color:#9FD9C9; font-size:32px; line-height:1.5; max-width:820px; }
.foot { position:absolute; bottom:70px; left:90px; color:#5E9C8A; font-size:24px; }
</style></head>
<body>
<div class="accent-bar"></div>
<div class="wrap">
  <div class="badge">Наш принцип</div>
  <h1>Мы открыто показываем<br><span>цены. Всегда.</span></h1>
  <p>Без «свяжитесь с менеджером». Хотите узнать стоимость — она уже на сайте.</p>
</div>
<div class="foot">офисная мебель · Казань</div>
</body></html>
